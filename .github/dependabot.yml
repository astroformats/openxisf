version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Every step of CodeQL must run one version, so its actions move in one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
