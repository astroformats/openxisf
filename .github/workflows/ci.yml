# SPDX-FileCopyrightText: 2026 Ezequiel Ruiz

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to run besides Linux, which always runs
        type: choice
        options: [all, windows, macos, linux]
        default: all
  workflow_call:
    inputs:
      fuzz-seconds:
        description: How long each fuzz target runs
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_COLOR_DIAGNOSTICS: "ON"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # Decides how much of the platform matrix runs. Windows and macOS minutes are expensive on private
  # repositories (a macOS minute counts ten times), so there they run only when asked for, on a manual
  # run, where the platforms input picks what to run; a version tag runs the Linux jobs. Public
  # repositories run everything on every pull request and tag. Linux always runs.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      vcpkg_port: ${{ steps.plan.outputs.vcpkg_port }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            selection="${PLATFORMS:-all}"
          elif [ "$PRIVATE" = false ]; then
            selection=all
          else
            selection=linux
          fi

          windows=false
          macos=false
          case "$selection" in
            all) windows=true; macos=true ;;
            windows) windows=true ;;
            macos) macos=true ;;
          esac
          echo "platforms: $selection"

          # The dependencies of the port, installed by name so that the binary cache can hold them. Linux also
          # builds the optional features.
          base="lz4 pugixml zlib zstd"
          rows='{"name":"x64-linux","runner":"ubuntu-24.04","triplet":"x64-linux","features":"[tbb,openssl]","packages":"'"$base"' tbb openssl"}'
          if [ "$windows" = true ]; then
            rows="$rows"',{"name":"x64-windows","runner":"windows-2025-vs2026","triplet":"x64-windows","features":"","packages":"'"$base"'"}'
          fi
          if [ "$macos" = true ]; then
            rows="$rows"',{"name":"arm64-osx","runner":"macos-15","triplet":"arm64-osx","features":"","packages":"'"$base"'"}'
          fi

          {
            echo "windows=$windows"
            echo "macos=$macos"
            echo "vcpkg_port=[$rows]"
          } >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Line endings
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::Text files must use LF line endings"
            exit 1
          fi

      - name: SPDX headers
        run: |
          missing=$(git ls-files -z '*.h' '*.cpp' '*.cmake' '*.in' '*.yml' '*.sh' '*.py' '*.js' '*CMakeLists.txt' |
            xargs -0 grep -L 'SPDX-License-Identifier: Apache-2.0' || true)
          if [ -n "$missing" ]; then
            echo "::error::Missing SPDX header in: $missing"
            exit 1
          fi

      - name: Version
        run: |
          project=$(sed -n 's/^    VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          port=$(jq -r .version packaging/vcpkg/vcpkg.json)
          echo "CMakeLists.txt: $project, vcpkg port: $port"
          test -n "$project" && test "$project" = "$port"

      - name: Formatting
        run: |
          pip install clang-format==22.1.3
          git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror

  linux:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14 x64 debug
            runner: ubuntu-24.04
            preset: linux-gcc-debug
            cxx: g++-14
          # Also builds the benchmarks and runs each once, so that they keep working.
          - name: gcc-14 x64 release
            runner: ubuntu-24.04
            preset: linux-gcc-release
            cxx: g++-14
            args: -DOPENXISF_BUILD_BENCHMARKS=ON
            packages: libbenchmark-dev
          - name: gcc-14 x64 release shared
            runner: ubuntu-24.04
            preset: linux-gcc-release
            cxx: g++-14
            args: -DBUILD_SHARED_LIBS=ON
          # Also builds the benchmarks, which run in oneTBB task arenas, and runs each once.
          - name: gcc-14 x64 release with oneTBB and OpenSSL
            runner: ubuntu-24.04
            preset: linux-gcc-release
            cxx: g++-14
            args: -DOPENXISF_WITH_TBB=ON -DOPENXISF_WITH_OPENSSL=ON -DOPENXISF_BUILD_BENCHMARKS=ON
            packages: libtbb-dev libssl-dev libbenchmark-dev
          - name: gcc arm64 release
            runner: ubuntu-24.04-arm
            preset: linux-gcc-release
            cxx: g++
          # Also without the SIMD kernels, so that their scalar fallback runs on x64 too.
          - name: clang-18 libstdc++ x64 release
            runner: ubuntu-24.04
            preset: linux-clang-release
            cxx: clang++-18
            args: -DOPENXISF_ENABLE_SIMD=OFF
          - name: clang-18 libc++ x64 release
            runner: ubuntu-24.04
            preset: linux-clang-libcxx-release
            cxx: clang++-18
            vcpkg: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        if: ${{ !matrix.vcpkg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev ${{ matrix.packages }}

      # vcpkg builds the dependencies with the compiler of CC and CXX, against libc++.
      - name: Install libc++
        if: ${{ matrix.vcpkg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-vcpkg
        if: ${{ matrix.vcpkg }}
        with:
          cache-key: linux-libcxx
          triplet: x64-linux-libcxx
          overlay-triplets: cmake/vcpkg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOPENXISF_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The oldest compilers supported, GCC 11 and Clang 15 (with libstdc++ 11), with the dependencies of Ubuntu 22.04. It
  # runs in a container of that release, which outlives its runner image, and takes CMake from PyPI, since the CMake of
  # Ubuntu 22.04 is older than the minimum.
  oldest-compilers:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-11 x64 release
            preset: linux-gcc-release
            cxx: g++-11
          - name: clang-15 x64 release
            preset: linux-clang-release
            cxx: clang++-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the compilers and the dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++-11 clang-15 ninja-build python3-pip \
            pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev
          pip3 install cmake

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOPENXISF_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The sanitizer presets run every test but the chain of the installed package (label package).
  sanitizers:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14 ASan and UBSan
            preset: linux-gcc-asan
            cxx: g++-14
          - name: clang-18 ASan and UBSan
            preset: linux-clang-asan
            cxx: clang++-18
          - name: clang-18 TSan
            preset: linux-clang-tsan
            cxx: clang++-18
          # The parallel work of oneTBB. vcpkg builds the dependencies with the instrumentation, oneTBB included, so
          # that ThreadSanitizer sees the synchronization of its scheduler; Clang builds them, as it builds the project.
          - name: clang-18 TSan with oneTBB
            preset: linux-clang-tsan-tbb
            cxx: clang++-18
            vcpkg: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        if: ${{ !matrix.vcpkg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev

      - name: Build the dependencies with Clang
        if: ${{ matrix.vcpkg }}
        run: |
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      # By name, so that the binary cache holds oneTBB, which the manifest has as a feature.
      - uses: ./.github/actions/setup-vcpkg
        if: ${{ matrix.vcpkg }}
        with:
          cache-key: linux-tsan
          triplet: x64-linux-tsan
          overlay-triplets: cmake/vcpkg
          packages: gtest lz4 pugixml tbb zlib zstd

      # The randomized address space of the 24.04 kernel is larger than Clang 18's sanitizers support.
      - name: Lower the address-space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOPENXISF_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Each fuzz target runs from its committed seeds under ASan and UBSan: a minute on pushes and pull requests, longer
  # on a release. The test also fails when a target covers less code than expected.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev

      # The randomized address space of the 24.04 kernel is larger than Clang 18's sanitizers support.
      - name: Lower the address-space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset linux-clang-fuzz -DOPENXISF_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER=clang++-18 -DOPENXISF_FUZZ_SECONDS=${{ inputs.fuzz-seconds || 60 }}

      - name: Build
        run: cmake --build --preset linux-clang-fuzz

      - name: Fuzz
        run: ctest --preset linux-clang-fuzz --parallel "$(nproc)"

      # ctest keeps the output of the tests that passed in its log, where each run states the edges it covered.
      - name: Coverage
        if: ${{ !cancelled() }}
        run: sed -n 's/^-- \(fuzz_.* covered .*\)$/::notice::\1/p' out/build/linux-clang-fuzz/Testing/Temporary/LastTest.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: out/build/linux-clang-fuzz/fuzz/artifacts
          if-no-files-found: ignore

      # The targets built as OSS-Fuzz builds them (fuzz/oss-fuzz/build.sh): no build type, the optimization and the
      # instrumentation in the flags of the compiler, and libFuzzer as the engine of OPENXISF_FUZZING_ENGINE. Each runs
      # its seeds once.
      - name: Build and run the targets with a fuzzing engine
        env:
          CXXFLAGS: -O1 -fno-omit-frame-pointer -gline-tables-only -fsanitize=address,undefined,fuzzer-no-link
        run: |
          cmake -S . -B out/build/fuzzing-engine -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DOPENXISF_WARNINGS_AS_ERRORS=ON -DOPENXISF_BUILD_TESTS=OFF \
            -DOPENXISF_BUILD_SAMPLES=OFF -DOPENXISF_INSTALL=OFF -DOPENXISF_BUILD_FUZZERS=ON \
            -DOPENXISF_FUZZING_ENGINE=-fsanitize=fuzzer
          cmake --build out/build/fuzzing-engine
          for seeds in fuzz/seeds/*/; do
            target=$(basename "$seeds")
            "out/build/fuzzing-engine/bin/fuzz_$target" -runs=0 "$seeds"
          done

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev \
            libbenchmark-dev libtbb-dev libssl-dev
          pip install clang-tidy==22.1.8

      # The configure step generates version.h and the compilation database. Nothing needs building. With oneTBB and
      # OpenSSL, the code that uses them is analyzed too.
      - name: Configure
        run: |
          cmake --preset linux-clang-release -DCMAKE_CXX_COMPILER=clang++-18 -DOPENXISF_BUILD_BENCHMARKS=ON \
            -DOPENXISF_WITH_TBB=ON -DOPENXISF_WITH_OPENSSL=ON

      # tests/package/main.cpp is built by its own project, which defines EXPECTED_VERSION as the version of the
      # OpenXISF it finds; here it is that of CMakeLists.txt. The Windows platform layer (*_win32.cpp) does not compile
      # on Linux.
      - name: clang-tidy
        run: |
          version=$(sed -n 's/^    VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          test -n "$version"
          git ls-files '*.cpp' ':!:*_win32.cpp' | xargs -P "$(nproc)" -n 1 \
            clang-tidy -p out/build/linux-clang-release --quiet --extra-arg="-DEXPECTED_VERSION=\"$version\""

  # OpenXISF in the build of another project (tests/package): from its sources through FetchContent, which gives that
  # project the library alone, and installed, through its pkg-config file.
  consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev

      - name: Build from the sources
        run: |
          cmake -S tests/package -B "$RUNNER_TEMP/sources" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DOPENXISF_CONSUMED_AS=sources -DOPENXISF_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DOPENXISF_WARNINGS_AS_ERRORS=ON
          cmake --build "$RUNNER_TEMP/sources"
          "$RUNNER_TEMP/sources/consumer"

      - name: Install the library
        run: |
          cmake --preset linux-gcc-release -DCMAKE_CXX_COMPILER=g++-14 -DOPENXISF_WARNINGS_AS_ERRORS=ON \
            -DOPENXISF_BUILD_TESTS=OFF -DOPENXISF_BUILD_SAMPLES=OFF -DOPENXISF_BUILD_FUZZERS=OFF
          cmake --build --preset linux-gcc-release
          cmake --install out/build/linux-gcc-release --prefix "$RUNNER_TEMP/prefix"

      - name: Build through pkg-config
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/prefix/lib/pkgconfig"
          pkg-config --validate openxisf
          echo "::notice::pkg-config: $(pkg-config --static --cflags --libs openxisf)"
          cmake -S tests/package -B "$RUNNER_TEMP/pkg-config" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DOPENXISF_CONSUMED_AS=pkg-config
          cmake --build "$RUNNER_TEMP/pkg-config"
          "$RUNNER_TEMP/pkg-config/consumer"

  # The units that the tests write, checked by others than the library: every header against the XML schema of XISF,
  # which is downloaded here and never committed, and every unit by an independent reader, xisftool of xisf-rs (MIT),
  # installed here and never linked. The second check only reports.
  writer-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev libxml2-utils

      - name: Configure
        run: cmake --preset linux-gcc-release -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build --preset linux-gcc-release --target openxisf_tests

      - name: Write the units of the tests
        run: |
          units="$RUNNER_TEMP/units"
          mkdir -p "$units"
          OPENXISF_WRITTEN_UNITS_DIR="$units" out/build/linux-gcc-release/bin/openxisf_tests --gtest_brief=1
          echo "::notice::$(find "$units" -name '*.xisf' | wc -l) monolithic and $(find "$units" -name '*.xish' | wc -l) distributed units written"

      # The server refuses clients that do not look like a browser.
      - name: Validate the headers against the XML schema
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/xisf-1.0.xsd" \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            https://pixinsight.com/xisf/xisf-1.0.xsd
          find "$RUNNER_TEMP/units" -name '*.xml' -print0 |
            xargs -0 -n 50 xmllint --noout --schema "$RUNNER_TEMP/xisf-1.0.xsd" > "$RUNNER_TEMP/xmllint.log" 2>&1 ||
            { grep -v ' validates$' "$RUNNER_TEMP/xmllint.log" | head -50; exit 1; }
          echo "::notice::$(grep -c ' validates$' "$RUNNER_TEMP/xmllint.log") headers valid"

      - name: Read the units with xisftool
        continue-on-error: true
        run: |
          cargo install xisftool --version 0.5.1 --locked --quiet
          failed=0
          total=0
          read_unit() {
            if ! xisftool info -v "$1" || ! xisftool verify "$1"; then
              return 1
            fi
            # The pixel data, decompressed, of units that have an image.
            if grep -q '<Image ' "${1%.xisf}.xml"; then
              xisftool dump "$1"
            fi
          }
          for unit in "$RUNNER_TEMP"/units/*.xisf; do
            total=$((total + 1))
            if ! read_unit "$unit" > /dev/null 2> "$RUNNER_TEMP/xisftool.log"; then
              failed=$((failed + 1))
              echo "::warning::xisftool cannot read $(basename "$unit"): $(head -c 300 "$RUNNER_TEMP/xisftool.log")"
            fi
          done
          echo "::notice::xisftool read $((total - failed)) of $total units"
          test "$failed" -eq 0

  windows:
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc x64 debug
            runner: windows-2025-vs2026
            arch: x64
            triplet: x64-windows
            preset: msvc-debug
          - name: msvc x64 release
            runner: windows-2025-vs2026
            arch: x64
            triplet: x64-windows
            preset: msvc-release
          - name: msvc x64 release shared
            runner: windows-2025-vs2026
            arch: x64
            triplet: x64-windows
            preset: msvc-release
            args: -DBUILD_SHARED_LIBS=ON
          - name: msvc x64 AddressSanitizer
            runner: windows-2025-vs2026
            arch: x64
            triplet: x64-windows
            preset: msvc-asan
          - name: clang-cl x64 release
            runner: windows-2025-vs2026
            arch: x64
            triplet: x64-windows
            preset: clang-cl-release
          # The oldest compiler supported: the MSVC of Visual Studio 2022. Its binary cache is its own, since vcpkg
          # builds the dependencies again for another compiler.
          - name: msvc x64 release (Visual Studio 2022)
            runner: windows-2022
            arch: x64
            triplet: x64-windows
            preset: msvc-release
            cache: -vs2022
          - name: msvc arm64 release
            runner: windows-11-arm
            arch: arm64
            triplet: arm64-windows
            preset: msvc-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before vcpkg: it builds the dependencies with the toolchain it finds, which has to be the one of the build.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.arch }}

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: windows-${{ matrix.triplet }}${{ matrix.cache }}
          triplet: ${{ matrix.triplet }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DOPENXISF_WARNINGS_AS_ERRORS=ON ${{ matrix.args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  msys2:
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2025
    name: ${{ matrix.name }}
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msys2 ucrt64 gcc release
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
            preset: msys2-ucrt64-gcc-release
          - name: msys2 ucrt64 gcc release shared
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
            preset: msys2-ucrt64-gcc-release
            args: -DBUILD_SHARED_LIBS=ON
          - name: msys2 clang64 release
            msystem: CLANG64
            prefix: mingw-w64-clang-x86_64
            compiler: clang
            preset: msys2-clang64-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          path-type: minimal
          install: >-
            ${{ matrix.prefix }}-${{ matrix.compiler }}
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-pugixml
            ${{ matrix.prefix }}-zlib
            ${{ matrix.prefix }}-lz4
            ${{ matrix.prefix }}-zstd
            ${{ matrix.prefix }}-gtest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOPENXISF_WARNINGS_AS_ERRORS=ON ${{ matrix.args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  macos:
    needs: plan
    if: ${{ needs.plan.outputs.macos == 'true' }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: appleclang arm64 release
            runner: macos-15
            preset: macos-release
            args: -DCMAKE_PREFIX_PATH=/opt/homebrew
          - name: appleclang arm64 release shared
            runner: macos-15
            preset: macos-release
            args: -DCMAKE_PREFIX_PATH=/opt/homebrew -DBUILD_SHARED_LIBS=ON
          - name: appleclang x64 release
            runner: macos-15-intel
            preset: macos-release
            vcpkg: true
            args: -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-osx
          # The oldest compiler supported: the AppleClang of the first Xcode 16 of the image.
          - name: appleclang arm64 release (Xcode 16)
            runner: macos-15
            preset: macos-release
            xcode: "16"
            args: -DCMAKE_PREFIX_PATH=/opt/homebrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the oldest Xcode ${{ matrix.xcode }}
        if: ${{ matrix.xcode }}
        run: |
          app=$(find /Applications -maxdepth 1 -name 'Xcode_${{ matrix.xcode }}.*.app' | sort | head -n 1)
          test -n "$app"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          "$app/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install the dependencies
        if: ${{ !matrix.vcpkg }}
        run: brew install pkgconf pugixml lz4 zstd googletest

      - uses: ./.github/actions/setup-vcpkg
        if: ${{ matrix.vcpkg }}
        with:
          cache-key: macos-x64-osx
          triplet: x64-osx

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DOPENXISF_WARNINGS_AS_ERRORS=ON ${{ matrix.args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The library built as a vcpkg port, then consumed through find_package. The port builds this checkout,
  # which the binary cache cannot see, so the cache is used for the dependencies only.
  vcpkg-port:
    needs: plan
    runs-on: ${{ matrix.runner }}
    name: vcpkg port ${{ matrix.name }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.vcpkg_port) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before vcpkg: the developer environment sets VCPKG_ROOT to the copy that ships with Visual Studio,
      # and the one set up below has to win.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: ${{ runner.os == 'Windows' }}

      # The dependencies come from the binary cache. The port itself is built from this checkout, which the
      # cache cannot see, so it is installed with binary caching off. Both run in a directory without a
      # vcpkg.json: next to one, vcpkg works in manifest mode and refuses package names.
      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: port-${{ matrix.triplet }}
          triplet: ${{ matrix.triplet }}
          packages: ${{ matrix.packages }}

      - name: Install the port
        working-directory: ${{ runner.temp }}
        run: |
          "$VCPKG_ROOT/vcpkg" install "openxisf${{ matrix.features }}" --binarysource=clear \
            --overlay-ports="$GITHUB_WORKSPACE/packaging/vcpkg" --triplet ${{ matrix.triplet }}

      - name: Build and run the consumer
        run: |
          cmake -S tests/package -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build-package
          ./build-package/consumer

  # A single check that stands for the whole workflow, and that a skipped platform does not break.
  required:
    if: ${{ always() }}
    needs: [plan, lint, linux, oldest-compilers, sanitizers, fuzz, tidy, consumers, writer-output, windows, msys2, macos,
            vcpkg-port]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped on purpose
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
