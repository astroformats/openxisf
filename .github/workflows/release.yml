name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # First, so that a wrong tag fails at once.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The README status in the form of a release, "**Status: X.Y.Z.**": a version in development is not released.
      - name: The tag matches the version of the project
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(sed -n 's/^    VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          port=$(jq -r .version packaging/vcpkg/vcpkg.json)
          status=$(sed -n 's/^\*\*Status: \([0-9][0-9.]*\)\.\*\*.*$/\1/p' README.md)
          echo "tag: $tag, CMakeLists.txt: $project, vcpkg port: $port, README status: $status"
          test "$tag" = "$project" && test "$tag" = "$port" && test "$tag" = "$status"

  # The commit of the tag is the merge of a publication, which ci.yml tested when it was pushed to main: the release
  # needs that run to have passed, and waits for it, rather than run the whole matrix on the same commit again. A run
  # that a later push to main cancelled leaves none; ci.yml can then be run on the tag by hand, and this job again.
  tested:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: The run of ci.yml on the commit passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          # The run appears within seconds of the push of the merge.
          runs=""
          for _ in $(seq 1 20); do
            runs=$(gh run list -R "$REPOSITORY" --workflow ci.yml --commit "$COMMIT" --limit 20 \
              --json databaseId,status,conclusion --jq '.[] | "\(.databaseId) \(.status) \(.conclusion)"')
            [ -n "$runs" ] && break
            sleep 30
          done
          echo "runs of ci.yml on $COMMIT:"
          echo "$runs"
          if echo "$runs" | grep -q ' completed success$'; then
            exit 0
          fi
          pending=$(echo "$runs" | awk '$2 != "completed" { print $1; exit }')
          if [ -n "$pending" ]; then
            gh run watch "$pending" -R "$REPOSITORY" --interval 60 --exit-status
            exit
          fi
          echo "::error::No run of ci.yml passed on $COMMIT. Run it on the tag (gh workflow run ci.yml --ref $GITHUB_REF_NAME), then this job again."
          exit 1

  # The longer fuzz run of a release, which ci.yml gives a minute.
  fuzz:
    needs: version
    uses: ./.github/workflows/fuzz.yml
    with:
      fuzz-seconds: 600

  docs:
    needs: [tested, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev

      - name: Build the API documentation
        run: |
          cmake --preset linux-gcc-release -DOPENXISF_BUILD_DOCS=ON
          cmake --build --preset linux-gcc-release --target docs

      - name: Archive the documentation
        run: tar -C out/build/linux-gcc-release/docs -czf "openxisf-${GITHUB_REF_NAME#v}-docs.tar.gz" html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: openxisf-*-docs.tar.gz
          if-no-files-found: error

  publish:
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" openxisf-*-docs.tar.gz \
            --title "OpenXISF ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
