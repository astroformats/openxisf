name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Before the matrix, so that a wrong tag fails at once.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the version of the project
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(sed -n 's/^    VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          port=$(jq -r .version packaging/vcpkg/vcpkg.json)
          echo "tag: $tag, CMakeLists.txt: $project, vcpkg port: $port"
          test "$tag" = "$project" && test "$tag" = "$port"

  # Everything that runs on a pull request, with a longer fuzz run: the full platform matrix in a public
  # repository, and the Linux jobs in a private one, whose Windows and macOS jobs run by hand (ci.yml).
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      fuzz-seconds: 600

  docs:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen pkg-config libpugixml-dev zlib1g-dev liblz4-dev libzstd-dev libgtest-dev

      - name: Build the API documentation
        run: |
          cmake --preset linux-gcc-release -DOPENXISF_BUILD_DOCS=ON
          cmake --build --preset linux-gcc-release --target docs

      - name: Archive the documentation
        run: tar -C out/build/linux-gcc-release/docs -czf "openxisf-${GITHUB_REF_NAME#v}-docs.tar.gz" html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: openxisf-*-docs.tar.gz
          if-no-files-found: error

  publish:
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" openxisf-*-docs.tar.gz \
            --title "OpenXISF ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
